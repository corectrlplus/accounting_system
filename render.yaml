services:
  - type: web
    name: license-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: license-db
          property: connectionString
    plan: free
    healthCheckPath: /api/health

databases:
  - name: license-db
    plan: free
    databaseName: license_server
