name: accounting_system
description: نظام المحاسبة وإدارة الأعمال - Accounting and Business Management System
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database
  drift: ^2.24.0
  drift_sqflite: ^2.0.1
  sqflite: ^2.4.0
  sqflite_common_ffi: ^2.3.0
  sqlite3: ^2.4.0

  # Financial
  decimal: ^3.0.0

  # Utilities
  uuid: ^4.5.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  crypto: ^3.0.6
  meta: ^1.15.0
  intl: ^0.20.0
  shared_preferences: ^2.5.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # UI
  cupertino_icons: ^1.0.8
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.24.0
  build_runner: ^2.4.14
  test: ^1.25.15
  lints: ^5.0.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
